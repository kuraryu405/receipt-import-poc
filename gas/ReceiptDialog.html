<!DOCTYPE html>
<html lang="ja">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    body { font-family: 'Noto Sans JP', sans-serif; color: #202020; font-size: 16px; line-height: 1.6; margin: 24px; }
    h1 { font-size: 24px; margin: 0 0 8px; } h2 { font-size: 18px; margin: 24px 0 12px; }
    p { margin: 8px 0 16px; } label { display: block; font-weight: bold; margin-bottom: 4px; }
    input,select,textarea { font: inherit; box-sizing: border-box; width: 100%; padding: 8px; border: 1px solid #666; border-radius: 4px; }
    textarea { min-height: 120px; } button { font: inherit; padding: 10px 20px; border-radius: 4px; border: 1px solid #0000ff; background: white; color: #0000ff; cursor: pointer; min-height: 44px; }
    button.primary { color: white; background: #0000ff; } button:disabled { background:#eee; color:#666; border-color:#999; cursor:default; }
    :focus-visible { outline: 3px solid black; outline-offset: 3px; box-shadow: 0 0 0 6px #ffff00; }
    .fields { display:grid; grid-template-columns: 1fr 1fr; gap:16px 24px; } .wide { grid-column:1/-1; }
    .actions { display:flex; flex-wrap:wrap; gap:12px; margin:16px 0; } .note { font-size:14px; color:#555; }
    #status { white-space:pre-wrap; } #status.error { color:#b60000; } #status a { display:block; }
    #confirm { width:20px; height:20px; margin-right:8px; } .confirmation { display:flex; align-items:start; margin-top:24px; font-weight:normal; }
    @media(max-width:550px) { .fields { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <h1>レシートを台帳に登録</h1>
  <p>取引日・金額・費目を確認してから登録してください。取引日の月のタブに1行追加します。</p>
  <details open id="importArea">
    <summary>読み取り結果を取り込む</summary>
    <label for="json">読み取り結果のJSON</label>
    <textarea id="json" spellcheck="false" aria-describedby="jsonHelp"></textarea>
    <p class="note" id="jsonHelp">PoCの「応答のJSONを表示する」の内容を貼り付けてください。複数枚の応答も取り込めます。取り込み直すと新しい登録になります。登録済みのレシートは取り込み直さないでください。</p>
    <div class="actions"><button id="import" type="button">JSONを取り込む</button><button id="demo" type="button">架空データを入れる</button></div>
  </details>
  <div id="receiptPicker" hidden><label for="receipt">登録するレシート</label><select id="receipt"></select></div>
  <form id="entry" hidden>
    <h2>登録内容</h2>
    <div class="fields">
      <div><label for="date">取引日（必須）</label><input id="date" type="date" required></div>
      <div><label for="merchant">支払先（必須）</label><input id="merchant" maxlength="500" required></div>
      <div class="wide"><label for="description">摘要（必須）</label><input id="description" maxlength="500" required></div>
      <div><label for="category">費目（必須）</label><select id="category" required><option value="">選択してください</option></select></div>
      <div><label for="total">出金額（円・必須）</label><input id="total" type="number" min="1" max="10000000" step="1" required></div>
      <div><label for="tax">消費税額（円）</label><input id="tax" type="number" min="0" step="1"></div>
      <div><label for="paymentMethod">支払方法（必須）</label><input id="paymentMethod" maxlength="500" required aria-describedby="cashHelp"><p class="note" id="cashHelp">小口現金の支払いを登録します。現金払いであることを確認してください。</p></div>
      <div class="wide"><label for="invoiceRegistrationNumber">適格請求書登録番号</label><input id="invoiceRegistrationNumber" maxlength="14" pattern="T[0-9]{13}"></div>
    </div>
    <p class="note" id="target"></p>
    <label class="confirmation"><input id="confirm" type="checkbox" required>元画像と照合し、取引日・支払先・金額・費目・現金払いを確認しました。</label>
    <div class="actions"><button id="register" class="primary" type="submit" disabled>確認して登録</button></div>
  </form>
  <p id="status" role="status" aria-live="polite">台帳の設定を読み込んでいます。</p>
  <script>
    const byId = id => document.getElementById(id);
    let receipts = [], ids = [], active = 0, options = null, busy = false;
    function status(text,error=false) { byId('status').className=error?'error':''; byId('status').textContent=text; }
    function refresh() {
      const month=byId('date').value.slice(0,7);
      const available=options && options.months.includes(month);
      byId('target').textContent=available?'登録先：'+month+'（レシート1枚につき1行）':'取引日の月のタブがありません。今回の架空台帳は2026-10・2026-11です。';
      byId('register').disabled=busy||!options||!byId('confirm').checked||!available;
    }
    function displayReceipt() {
      const r=receipts[active];
      for(const name of ['date','merchant','total','tax','paymentMethod','invoiceRegistrationNumber']) byId(name).value=r[name]??'';
      byId('description').value=Array.isArray(r.items)?r.items.map(x=>x.name).filter(x=>typeof x==='string'&&x).join('、').slice(0,500):'';
      byId('category').value=''; byId('confirm').checked=false;
      byId('entry').hidden=false; refresh();
    }
    byId('import').addEventListener('click',()=>{
      try {
        const raw=JSON.parse(byId('json').value);
        const list=Array.isArray(raw.receipts)?raw.receipts:[raw.receipt??raw];
        if(!list.length||list.length>10||list.some(r=>!r||typeof r!=='object'||Array.isArray(r))) throw new Error();
        // PoCのimageIdは画面を開き直すと再利用されるため、台帳の登録IDには使わない。
        // 同じ確認画面での再送には同じIDを使い、取り込み直しは新しい登録として扱う。
        receipts=list; ids=list.map(()=>crypto.randomUUID()); active=0;
        byId('receipt').replaceChildren(...list.map((r,i)=>new Option((i+1)+'. '+(r.merchant??'店舗名未読'),String(i))));
        byId('receiptPicker').hidden=list.length===1; displayReceipt(); byId('importArea').open=false;
        status('読み取り結果を取り込みました。空欄と誤りを修正し、費目を選んでください。');
      } catch { status('JSONを取り込めませんでした。PoCの生JSONを貼り付けてください。最大10件です。',true); }
    });
    byId('demo').addEventListener('click',()=>{
      byId('json').value=JSON.stringify({imageId:crypto.randomUUID(),merchant:'架空のレシート商店',date:'2026-10-06',total:1234,tax:112,paymentMethod:'現金',invoiceRegistrationNumber:null,items:[{name:'事務用品（動作確認用）'}]},null,2);
      byId('import').click(); status('架空データです。OCRの実測ではありません。費目を選び、確認して登録してください。');
    });
    byId('receipt').addEventListener('change',()=>{active=Number(byId('receipt').value);displayReceipt();status('表示するレシートを切り替えました。');});
    byId('entry').addEventListener('input',event=>{if(event.target.id!=='confirm') byId('confirm').checked=false;refresh();});
    byId('entry').addEventListener('submit',event=>{
      event.preventDefault(); if(busy||!byId('confirm').checked||!options)return;
      const payload={registrationId:ids[active],approved:true,total:Number(byId('total').value),tax:byId('tax').value===''?null:Number(byId('tax').value)};
      for(const key of ['date','merchant','description','category','paymentMethod','invoiceRegistrationNumber'])payload[key]=byId(key).value;
      busy=true; byId('entry').querySelectorAll('input,select,button').forEach(el=>el.disabled=true); byId('import').disabled=true;byId('demo').disabled=true;byId('receipt').disabled=true;
      status('台帳に登録しています。');
      const unlock=()=>{busy=false;byId('entry').querySelectorAll('input,select').forEach(el=>el.disabled=false);byId('import').disabled=false;byId('demo').disabled=false;byId('receipt').disabled=false;refresh();};
      google.script.run.withSuccessHandler(result=>{
        unlock();status(result.duplicate?'登録済みです。行は追加していません。':result.sheet+' の'+result.row+'行目に登録しました。');
        const link=document.createElement('a');link.href=result.url;link.target='_blank';link.rel='noopener';link.textContent='登録した行を開く';byId('status').append(link);
      }).withFailureHandler(error=>{unlock();status(error.message||'登録できませんでした。同じ登録IDで再度お試しください。',true);}).registerApprovedReceipt(payload);
    });
    google.script.run.withSuccessHandler(result=>{
      options=result;result.categories.forEach(c=>byId('category').append(new Option(c,c)));status('JSONを取り込むか、架空データで登録を試してください。');refresh();
    }).withFailureHandler(error=>status(error.message||'台帳の設定を取得できませんでした。',true)).getLedgerOptions();
  </script>
</body>
</html>
